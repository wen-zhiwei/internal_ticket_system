services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: internal_ticket_system
      POSTGRES_USER: internal_ticket_system
      POSTGRES_PASSWORD: internal_ticket_system
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data

  assistant:
    profiles: ["assistant"]
    build:
      context: ./assistant-service
    environment:
      DATABASE_URL: postgresql://internal_ticket_system:internal_ticket_system@postgres:5432/internal_ticket_system?sslmode=disable
      GO_API_BASE_URL: http://host.docker.internal:8080/api
      ASSISTANT_SERVICE_TOKEN: ${ASSISTANT_SERVICE_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8090:8090"
    depends_on:
      - postgres
